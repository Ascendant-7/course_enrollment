<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      margin-bottom: 30px;
    }

    h1 {
      color: #667eea;
      margin-bottom: 10px;
      font-size: 32px;
    }

    .subtitle {
      color: #6b7280;
      font-size: 16px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .menu-card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      text-decoration: none;
      color: inherit;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .menu-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
    }

    .menu-icon {
      font-size: 64px;
      margin-bottom: 15px;
    }

    .menu-title {
      font-size: 20px;
      font-weight: bold;
      color: #667eea;
      margin-bottom: 10px;
    }

    .menu-description {
      font-size: 14px;
      color: #6b7280;
      line-height: 1.5;
    }

    .logout-section {
      text-align: center;
    }

    .logout-btn {
      display: inline-block;
      padding: 12px 30px;
      background: #dc3545;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .logout-btn:hover {
      background: #c82333;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🛡️ Admin Dashboard</h1>
      <p class="subtitle">Manage users and system settings</p>
    </div>

    <div class="menu-grid">
      <a href="/admin/register" class="menu-card">
        <div class="menu-icon">👥</div>
        <div class="menu-title">Add User</div>
        <div class="menu-description">Create new accounts (auto-approved)</div>
      </a>

      <a href="/admin/users" class="menu-card">
        <div class="menu-icon">📋</div>
        <div class="menu-title">Manage Users</div>
        <div class="menu-description">View, edit, and manage all users</div>
      </a>

      <a href="/courses" class="menu-card">
        <div class="menu-icon">📚</div>
        <div class="menu-title">View Courses</div>
        <div class="menu-description">Browse all available courses</div>
      </a>

      <a href="/admin/reports" class="menu-card">
        <div class="menu-icon">📊</div>
        <div class="menu-title">Reports</div>
        <div class="menu-description">View enrollment and system reports</div>
      </a>
    </div>

    <div class="logout-section">
      <form th:action="@{/logout}" method="post">
        <button type="submit" class="logout-btn">Logout</button>
      </form>
    </div>
  </div>
</body>
</html>
