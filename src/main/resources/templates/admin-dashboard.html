<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Course Enrollment System</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #667eea;
            font-size: 28px;
        }

        .header-actions {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .stat-icon {
            font-size: 48px;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }

        .stat-icon.users {
            background: #e3f2fd;
        }

        .stat-icon.courses {
            background: #f3e5f5;
        }

        .stat-icon.enrollments {
            background: #e8f5e9;
        }

        .stat-icon.pending {
            background: #fff3e0;
        }

        .stat-content h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .stat-content .number {
            color: #333;
            font-size: 32px;
            font-weight: bold;
        }

        .quick-actions {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .quick-actions h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .actions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .action-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 8px;
            color: white;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transition: transform 0.3s ease;
        }

        .action-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(102, 126, 234, 0.3);
        }

        .action-card .icon {
            font-size: 36px;
        }

        .action-card .title {
            font-size: 16px;
            font-weight: 600;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🎓 Admin Dashboard</h1>
            <div class="header-actions">
                <a th:href="@{/user/profile}" class="btn btn-primary">My Profile</a>
                <a th:href="@{/logout}" class="btn btn-danger">Logout</a>
            </div>
        </div>

        <!-- Statistics -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon users">👥</div>
                <div class="stat-content">
                    <h3>Total Users</h3>
                    <div class="number" th:text="${totalUsers}">0</div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon courses">📚</div>
                <div class="stat-content">
                    <h3>Total Courses</h3>
                    <div class="number" th:text="${totalCourses}">0</div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon enrollments">✓</div>
                <div class="stat-content">
                    <h3>Total Enrollments</h3>
                    <div class="number" th:text="${totalEnrollments}">0</div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon pending">⏳</div>
                <div class="stat-content">
                    <h3>Pending Approvals</h3>
                    <div class="number" th:text="${pendingApprovals}">0</div>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions">
            <h2>Quick Actions</h2>
            <div class="actions-grid">
                <a th:href="@{/admin/users/management}" class="action-card">
                    <div class="icon">👥</div>
                    <div class="title">Manage Users</div>
                </a>

                <a th:href="@{/admin/users/create}" class="action-card">
                    <div class="icon">➕</div>
                    <div class="title">Create User</div>
                </a>

                <a th:href="@{/admin/approvals}" class="action-card">
                    <div class="icon">✅</div>
                    <div class="title">User Approvals</div>
                </a>

                <a th:href="@{/admin/courses}" class="action-card">
                    <div class="icon">📚</div>
                    <div class="title">Manage Courses</div>
                </a>

                <a th:href="@{/admin/courses/create}" class="action-card">
                    <div class="icon">➕</div>
                    <div class="title">Create Course</div>
                </a>

                <a th:href="@{/courses}" class="action-card">
                    <div class="icon">👁️</div>
                    <div class="title">View All Courses</div>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
