<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Classrooms</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <style>
        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .classroom-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .classroom-card {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
        }
        .classroom-card h3 {
            margin-top: 0;
            color: #007bff;
        }
        .classroom-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .btn {
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            display: inline-block;
            border: none;
            cursor: pointer;
        }
        .btn-primary {
            background: #007bff;
            color: white;
        }
        .btn-danger {
            background: #dc3545;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏫 My Classrooms</h1>
        <p><a th:href="@{/teacher/dashboard}">← Back to Dashboard</a></p>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${param.error}" class="alert alert-error">
            You don't have permission to access this classroom.
        </div>

        <div style="margin-bottom: 20px;">
            <a th:href="@{/teacher/classrooms/create}" class="btn btn-primary">➕ Create New Classroom</a>
        </div>

        <div class="classroom-grid">
            <div th:if="${#lists.isEmpty(classrooms)}">
                <p>No classrooms created yet.</p>
            </div>

            <div th:each="classroom : ${classrooms}" class="classroom-card">
                <h3 th:text="${classroom.name}">Classroom Name</h3>
                <p><strong>Building:</strong> <span th:text="${classroom.building}">A</span></p>
                <p><strong>Room Number:</strong> <span th:text="${classroom.roomNumber}">101</span></p>
                <p><strong>Capacity:</strong> <span th:text="${classroom.capacity}">30</span></p>
                <p th:if="${classroom.course}">
                    <strong>Course:</strong> <span th:text="${classroom.course.code + ' - ' + classroom.course.name}">Course</span>
                </p>
                
                <div class="classroom-actions">
                    <a th:href="@{/teacher/classrooms/{id}/edit(id=${classroom.id})}" class="btn btn-primary">Edit</a>
                    <form th:action="@{/teacher/classrooms/{id}/delete(id=${classroom.id})}" method="post" 
                          style="display: inline;" 
                          onsubmit="return confirm('Are you sure you want to delete this classroom?');">
                        <button type="submit" class="btn btn-danger">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
