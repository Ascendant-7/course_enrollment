<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management</title>
  <style>
    :root{--bg1:#667eea;--bg2:#764ba2;--card:#fff;--text:#111827;--muted:#6b7280;--shadow:0 18px 45px rgba(17,24,39,.18);}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;padding:24px;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--text);}
    .container{max-width:1100px;margin:0 auto;}
    .header{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:20px 24px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;}
    h1{font-size:24px;margin:0;}
    .link{color:var(--bg1);text-decoration:none;font-weight:700;}
    .message{background:#d1fae5;border:1px solid #bbf7d0;color:#065f46;padding:12px 14px;border-radius:10px;margin-bottom:12px;}
    .card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;}
    table{width:100%;border-collapse:collapse;}
    th,td{padding:12px 14px;text-align:left;}
    th{background:rgba(102,126,234,.12);font-weight:800;color:#374151;}
    tr:nth-child(even){background:#f8fafc;}
    .badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700;}
    .approved{background:#dcfce7;color:#166534;}
    .pending{background:#fef3c7;color:#92400e;}
    .role{background:#e0e7ff;color:#3730a3;}
    .actions form{display:inline;}
    .btn{border:0;border-radius:8px;padding:7px 11px;font-weight:700;cursor:pointer;margin-right:6px;}
    .approve{background:#22c55e;color:#fff;}
    .revoke{background:#f59e0b;color:#fff;}
    .delete{background:#ef4444;color:#fff;}
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>👥 User Management</h1>
      <div>
        <a class="link" th:href="@{/admin/dashboard}">Dashboard</a>
      </div>
    </div>

    <div th:if="${message}" class="message" th:text="${message}"></div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>ID</th><th>Username</th><th>Roles</th><th>Status</th><th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="u : ${users}">
            <td th:text="${u.id}"></td>
            <td th:text="${u.username}"></td>
            <td>
              <span th:each="r : ${u.roles}" class="badge role" th:text="${r.name.replace('ROLE_','')}"></span>
            </td>
            <td>
              <span class="badge" th:classappend="${u.approved} ? ' approved' : ' pending'"
                    th:text="${u.approved} ? 'Approved' : 'Pending'"></span>
            </td>
            <td class="actions">
              <a class="btn" style="background:#3b82f6;color:#fff" th:href="@{/admin/users/{id}/edit(id=${u.id})}">Edit</a>
              <form th:action="@{/admin/users/{id}/approve(id=${u.id})}" method="post" th:if="${!u.approved}" style="display:inline;">
                <button class="btn approve" type="submit">Approve</button>
              </form>
              <form th:action="@{/admin/users/{id}/reject(id=${u.id})}" method="post" th:if="${u.approved}" style="display:inline;">
                <button class="btn revoke" type="submit">Revoke</button>
              </form>
              <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post" onsubmit="return confirm('Delete this user?');" style="display:inline;">
                <button class="btn delete" type="submit">Delete</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
