<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${course.name} + ' - Students'">Course Students</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #667eea;
            font-size: 28px;
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .section h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .student-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .student-info {
            flex: 1;
        }

        .student-name {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 2px;
        }

        .student-username {
            color: #666;
            font-size: 14px;
        }

        .enrollment-date {
            color: #888;
            font-size: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .course-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            font-weight: bold;
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 16px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1 th:text="${course.name} + ' - Students'">Course Students</h1>
            <div class="header-actions">
                <a th:href="${isTeacher ? '/teacher/courses' : '/courses'}" class="btn btn-secondary">Back to Courses</a>
                <a th:if="${student != null or isTeacher}" th:href="@{/logout}" class="btn btn-danger">Logout</a>
                <a th:if="${student == null and !isTeacher}" th:href="@{/login}" class="btn btn-primary">Login</a>
            </div>
        </div>

        <!-- Course Details Section -->
        <div class="section">
            <h2>Course Information</h2>
            <div class="course-info">
                <div class="info-item">
                    <span class="info-label">Course Code</span>
                    <span class="info-value" th:text="${course.code}">CODE</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Course Name</span>
                    <span class="info-value" th:text="${course.name}">Name</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Credits</span>
                    <span class="info-value" th:text="${course.credits}">Credits</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Capacity</span>
                    <span class="info-value" th:text="${course.capacity}">Capacity</span>
                </div>
            </div>
        </div>

        <!-- Students Section -->
        <div class="section">
            <h2>Enrolled Students</h2>
            <div th:if="${enrollments.isEmpty()}" class="empty-state">
                <div class="empty-state-icon">👥</div>
                <p>No students enrolled in this course yet.</p>
            </div>
            <div th:each="enrollment : ${enrollments}" class="student-card">
                <div class="student-info">
                    <div class="student-name" th:text="${enrollment.student.username}">Student Username</div>
                    <div class="student-username" th:text="'@' + ${enrollment.student.username}">Username</div>
                    <div class="enrollment-date" th:text="'Enrolled: ' + ${enrollment.enrollmentDate}">Enrollment Date</div>
                </div>
            </div>
        </div>

        <!-- Navigation Section -->
        <div class="section">
            <h2>Members</h2>
            <div class="nav-links">
                <a th:href="@{/courses/{id}/teachers(id=${course.id})}" class="btn btn-primary">View Teachers</a>
            </div>
        </div>
    </div>
</body>
</html>
