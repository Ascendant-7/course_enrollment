<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Edit User</title>
  <style>
    :root{--bg1:#667eea;--bg2:#764ba2;--card:#fff;--text:#111827;--border:#e5e7eb;--ring:rgba(102,126,234,.28);}
    body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2));min-height:100vh;margin:0;padding:24px;color:var(--text);}
    .page{max-width:600px;margin:0 auto;background:var(--card);border-radius:14px;box-shadow:0 18px 45px rgba(17,24,39,.18);padding:20px;}
    h1{margin:0 0 12px;color:#4f46e5;}
    .field{margin-top:12px;}
    .label{display:block;font-size:13px;font-weight:700;color:#374151;margin-bottom:6px;}
    .input,.select{width:100%;height:44px;padding:10px 12px;border-radius:12px;border:1px solid var(--border);outline:none;font-size:14px;background:#fff;transition:box-shadow .15s ease,border-color .15s ease;}
    .input:focus,.select:focus{border-color:#7c83f7;box-shadow:0 0 0 4px var(--ring);}
    .row{display:flex;gap:12px;align-items:center;margin-top:8px;}
    .btn{border:0;border-radius:10px;padding:10px 16px;font-weight:800;color:#fff;background:linear-gradient(135deg,#667eea,#764ba2);cursor:pointer;}
    .link{margin-left:8px;text-decoration:none;color:#667eea;font-weight:700;}
  </style>
</head>
<body>
  <div class="page">
    <h1>Edit User</h1>

    <form th:action="@{/admin/users/{id}/edit(id=${userId})}" th:object="${form}" method="post">
      <div class="field">
        <label class="label" for="username">Username</label>
        <input class="input" id="username" type="text" th:field="*{username}" required />
      </div>

      <div class="field">
        <label class="label" for="role">Role</label>
        <select class="select" id="role" th:field="*{role}" required>
          <option value="STUDENT">Student</option>
          <option value="TEACHER">Teacher</option>
          <option value="ADMIN">Admin</option>
        </select>
      </div>

      <div class="field">
        <label class="label">Approved</label>
        <div class="row">
          <input id="approved" type="checkbox" th:field="*{approved}" />
          <label for="approved">Approved</label>
        </div>
      </div>

      <div class="field">
        <label class="label" for="newPassword">New Password (optional)</label>
        <input class="input" id="newPassword" type="password" th:field="*{newPassword}" placeholder="Leave blank to keep current" />
      </div>

      <div class="row" style="margin-top:16px;">
        <button class="btn" type="submit">Save</button>
        <a class="link" th:href="@{/admin/users}">Cancel</a>
      </div>
    </form>
  </div>
</body>
</html>
