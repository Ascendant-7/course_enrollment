<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Classroom Schedule</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .table-container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header-title { color: #0d6efd; font-weight: bold; margin-bottom: 25px; }
    </style>
</head>
<body class="py-5">
    <div class="container">
        <div class="table-container">
            <h2 class="header-title text-center">Classroom Schedule View</h2>
            
            <div class="table-responsive">
                <table class="table table-hover table-bordered shadow-sm">
                    <thead class="table-dark">
                        <tr>
                            <th class="text-center">Room</th>
                            <th class="text-center">Course</th>
                            <th class="text-center">Students</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="room : ${classrooms}">
                            <td class="fw-bold text-center" th:text="${room.roomName}">Room A-101</td>
                            <td class="text-center" th:text="${room.course != null ? room.course.name : 'N/A'}">Course Name</td>
                            <td>
                                <ul class="list-group list-group-flush">
                                    <li class="list-group-item py-1" th:each="enroll : ${room.enrollments}" 
                                        th:text="${enroll.student.username}">Student Name</li>
                                    <li class="list-group-item text-muted small" th:if="${#lists.isEmpty(room.enrollments)}">Don't have any students yet.</li>
                                </ul>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(classrooms)}">
                            <td colspan="3" class="text-center py-4 text-muted">Don't have any data in the system yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
