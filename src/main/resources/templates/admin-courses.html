<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Course Management</title>

    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>

<body>
<div class="container">

    <!-- Header -->
    <div class="header">
        <h1>Course Management</h1>
        <a th:href="@{/admin/courses/new}" class="btn btn-primary">
            Add New Course
        </a>
    </div>

    <!-- Success Message -->
    <div th:if="${message}" class="admin-message admin-success" th:text="${message}"></div>

    <!-- Course Table -->
    <table th:if="${#lists.isNotEmpty(courses)}" class="admin-courses-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Code</th>
            <th>Name</th>
            <th>Credits</th>
            <th>Capacity</th>
            <th>Available Seats</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="course : ${courses}">
            <td th:text="${course.id}"></td>
            <td th:text="${course.code}"></td>
            <td th:text="${course.name}"></td>
            <td th:text="${course.credits}"></td>
            <td th:text="${course.capacity}"></td>
            <td th:text="${course.availableSeats}"></td>
            <td>
                <a th:href="@{/admin/courses/edit/{id}(id=${course.id})}"
                   class="btn btn-success">
                    Edit
                </a>
                <a th:href="@{/admin/courses/delete/{id}(id=${course.id})}"
                   class="btn btn-danger"
                   onclick="return confirm('Are you sure you want to delete this course?')">
                    Delete
                </a>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(courses)}" class="admin-empty">
        No courses found.
    </div>

    <br>

    <!-- Back Button -->
    <a th:href="@{/admin/dashboard}" class="btn btn-secondary">
        Back to Dashboard
    </a>

</div>
</body>
</html>
