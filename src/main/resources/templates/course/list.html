<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Available Courses</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-5">
    <h1 class="mb-4">Available Courses</h1>

    <!-- Check if there are courses -->
    <div th:if="${#lists.isEmpty(courses)}" class="alert alert-info">
        No courses available at the moment.
    </div>

    <table th:if="${!#lists.isEmpty(courses)}" class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th scope="col">Title</th>
                <th scope="col">Description</th>
                <th scope="col">Credits</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="course : ${courses}">
                <td th:text="${course.name}">Course Name</td>
                <td th:text="${course.description}">Course Description</td>
                <td th:text="${course.credits}">0</td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Bootstrap JS Bundle (optional for interactive components) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
