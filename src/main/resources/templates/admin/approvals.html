<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Pending Approvals</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <style>
        .approval-list {
            margin: 20px 0;
        }
        .approval-card {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
        }
        .approval-card h3 {
            margin-top: 0;
            color: #007bff;
        }
        .approval-card .info {
            margin: 10px 0;
        }
        .approval-card .actions {
            margin-top: 15px;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-right: 10px;
        }
        .btn-primary {
            background: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background: #0056b3;
        }
        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Pending User Approvals</h1>
        <p><a th:href="@{/admin/dashboard}">← Back to Dashboard</a></p>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div class="approval-list">
            <div th:if="${#lists.isEmpty(pendingUsers)}">
                <p>No pending approvals at this time.</p>
            </div>

            <div th:each="user : ${pendingUsers}" class="approval-card">
                <h3 th:text="${user.username}">Username</h3>
                <div class="info">
                    <p><strong>Email:</strong> <span th:text="${user.email}">email</span></p>
                    <p><strong>Full Name:</strong> <span th:text="${user.firstName + ' ' + user.lastName}">Name</span></p>
                    <p><strong>Registration Date:</strong> <span th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}">Date</span></p>
                </div>
                <div class="actions">
                    <a th:href="@{/admin/approvals/{id}(id=${user.id})}" class="btn btn-primary">Review & Approve</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
